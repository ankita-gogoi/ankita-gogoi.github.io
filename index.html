<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projects and notebook by Ankita Gogoi.">
    <title>Ankita Gogoi | Portfolio</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f7f8fc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
        }

        .page {
            width: min(100% - 2rem, 1040px);
            margin: 0 auto;
        }

        header {
            padding: clamp(3.5rem, 10vw, 7rem) 0 2.5rem;
        }

        .eyebrow {
            margin: 0 0 0.75rem;
            color: #5263c5;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.4rem, 7vw, 4.25rem);
            letter-spacing: -0.055em;
            line-height: 1.05;
        }

        header p:last-child {
            max-width: 38rem;
            margin: 1rem 0 0;
            color: #5b6475;
            font-size: 1.1rem;
            line-height: 1.7;
        }

        .projects {
            padding: 1.5rem 0 5rem;
        }

        .section-heading {
            margin: 0 0 1.5rem;
            font-size: 1.65rem;
            letter-spacing: -0.035em;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr));
            gap: 1.5rem;
        }

        .project-card {
            overflow: hidden;
            border: 1px solid #e6e9f1;
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 12px 32px rgb(23 32 51 / 5%);
        }

        .project-image {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            background: #edf0f8;
        }

        .project-content {
            padding: 1.35rem;
        }

        .project-content h3 {
            margin: 0;
            font-size: 1.25rem;
            letter-spacing: -0.025em;
        }

        .project-content p {
            margin: 0.65rem 0 1.15rem;
            color: #5b6475;
            line-height: 1.65;
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            color: #4658bd;
            font-weight: 700;
            text-decoration: none;
        }

        .project-link:hover {
            text-decoration: underline;
            text-underline-offset: 0.2em;
        }

        .project-link:focus-visible {
            border-radius: 0.2rem;
            outline: 3px solid #9ca8ff;
            outline-offset: 3px;
        }

        footer {
            padding: 1.5rem 0 2rem;
            border-top: 1px solid #e6e9f1;
            color: #6b7280;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <p class="eyebrow">Portfolio</p>
            <h1>Ankita Gogoi</h1>
            <p>A collection of my projects, analysis, and notebook work.</p>
        </header>

        <main>
            <section class="projects" aria-labelledby="projects-heading">
                <h2 class="section-heading" id="projects-heading">Projects</h2>
                <div class="project-grid">
                    <article class="project-card">
                        <img
                            class="project-image"
                            src="projects/project1/chart.png"
                            alt="Chart visualization from Project 1"
                        >
                        <div class="project-content">
                            <h3>Project 1</h3>
                            <p>Explore the analysis and visualizations in this project notebook.</p>
                            <a class="project-link" href="projects/project1/notebook.html">
                                View notebook <span aria-hidden="true">&rarr;</span>
                            </a>
                        </div>
                    </article>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Ankita Gogoi</p>
        </footer>
    </div>
</body>
</html>
